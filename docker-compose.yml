services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: scrubber
      POSTGRES_USER: scrubber
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrubber -d scrubber"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://scrubber:local-dev-only@db:5432/scrubber
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
